name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -bench . -benchtime=100x -run '^$' ./...

  apidiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go install golang.org/x/exp/cmd/apidiff@latest
      - run: |
          git fetch origin main
          # Tolerate failure: the first commit has no baseline to diff against.
          apidiff origin/main -- $(go list ./...) || true
